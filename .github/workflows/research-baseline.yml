name: Research baseline audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scanner/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research-baseline.yml"
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research-baseline.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Record environment
        run: |
          mkdir -p audit-artifacts
          python --version > audit-artifacts/environment.txt
          python -m pip freeze >> audit-artifacts/environment.txt
          git rev-parse HEAD > audit-artifacts/commit.txt
          sha256sum requirements.txt > audit-artifacts/requirements.sha256
      - name: Run regression tests
        env:
          # Offline regression suite uses mocked provider calls; never use a live key here.
          MASSIVE_API_KEY: offline-test-placeholder
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --disable-warnings --maxfail=1 --junitxml=audit-artifacts/pytest-results.xml 2>&1 | tee audit-artifacts/pytest-output.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-baseline-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 30
